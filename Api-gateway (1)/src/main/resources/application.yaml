server:
  port: 9090

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:

      # ================================
      # ROUTES
      # ================================
      routes:

        # -------------------------------
        # PRODUCT SERVICE ROUTE
        # -------------------------------
        - id: PRODUCT-SERVICE
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1

        # -------------------------------
        # INVENTORY SERVICE ROUTE
        # -------------------------------
        - id: INVENTORY-SERVICE
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=1

        # -------------------------------
        # ORDER SERVICE ROUTE
        # -------------------------------
        - id: ORDER-SERVICE
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1

      # Enable automatic routing (optional)
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
